name: Novo
kind: company
description: Novo is a New York- and Miami-based financial technology company, founded
  in 2016, that operates a digital business-banking platform for small businesses,
  entrepreneurs, and freelancers. Novo is not itself a chartered bank; it is a service
  provider to Middlesex Federal Savings, F.A. (Member FDIC), which holds the deposits
  and provides the underlying banking products accessed through Novo's app. The platform
  offers fee-free business checking, invoicing, Novo Reserves, expense management,
  a business debit/credit card, working-capital funding, and inbound integrations
  with tools like QuickBooks, Stripe, Shopify, and Wise. On open-finance posture,
  Novo publishes no first-party public developer API and runs no developer portal;
  consumer-permissioned account data (Auth, Balance, Identity, Transactions) is reached
  by third parties only through the Plaid aggregator. No documented FDX participation
  or CFPB Section 1033 data-access commitment is published as of this review.
